<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành CSS Box Model 1</title>
    <!-- Liên kết file CSS bên ngoài -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="text-align: center;">Thực Hành CSS Box Model</h1>

    <!-- 3 thẻ card cùng class theo yêu cầu -->
    <div class="card">
        <h3>Thẻ 1 (content-box)</h3>
        <p>box-sizing: content-box | Kích thước thực tế sẽ bị phình to ra.</p>
    </div>

    <div class="card">
        <h3>Thẻ 2 (border-box)</h3>
        <p>box-sizing: border-box | Kích thước thực tế giữ nguyên 280x150px.</p>
    </div>

    <div class="card">
        <h3>Thẻ 3 (border-box)</h3>
        <p>box-sizing: border-box | Kích thước cố định, dễ kiểm soát bố cục.</p>
    </div>

</body>
</html>
